<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
  <title>Tip Calculator</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
<script defer src="https://cloud.umami.is/script.js" data-website-id="be32beae-a2a9-423f-b55d-e646ec260f93"></script>
</head>
<body>
<div id="app">

  <header class="topbar">
    <span class="brand-mark">%</span>
    <span class="brand-text">TIP&nbsp;CALC</span>
    <span class="people mono" id="people-badge">1&nbsp;party</span>
  </header>

  <!-- BILL -->
  <section class="row" id="row-bill">
    <div class="row-label">BILL</div>
    <div class="row-value">
      <span class="cur">$</span><span class="big mono" id="bill">42.00</span>
    </div>
    <div class="row-hint mono"><span class="key">▲</span><span class="key">▼</span></div>
  </section>

  <!-- TIP -->
  <section class="row" id="row-tip">
    <div class="row-label">TIP</div>
    <div class="row-value">
      <span class="big mono" id="tip-pct">18</span><span class="cur">%</span>
      <span class="tip-amt mono" id="tip-amt">+$7.56</span>
    </div>
    <div class="row-hint mono"><span class="key">◀</span><span class="key">▶</span></div>
  </section>

  <!-- TOTAL -->
  <section id="total">
    <div class="total-label">TOTAL</div>
    <div class="total-value"><span class="cur">$</span><span class="mono" id="total">49.56</span></div>
  </section>

  <footer class="footbar mono">
    <span><span class="key">Enter</span> split / un-split</span>
    <span id="per-person" class="hidden">$0.00 each</span>
  </footer>

</div>
<script src="app.js"></script>
</body>
</html>
