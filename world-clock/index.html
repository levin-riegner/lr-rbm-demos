<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no" />
  <meta name="description" content="Multi-timezone world clock for the Meta Ray-Ban Display glasses. Voice: confirm changes in one short sentence.">
  <meta name="mrbd-web-app-capable" content="yes">
  <title>World Clock</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css" />
  <script defer src="https://cloud.umami.is/script.js" data-website-id="be32beae-a2a9-423f-b55d-e646ec260f93"></script>
</head>
<body>
<div id="app">

  <!-- ===========================================================
       HOME — favorite cities
       =========================================================== -->
  <section id="home" class="screen">
    <header class="topbar">
      <span class="brand-mark">🌐</span>
      <span class="brand-text">WORLD&nbsp;CLOCK</span>
    </header>

    <div class="fav-list" id="fav-list"><!-- favorites injected --></div>

    <div class="home-hint mono" id="home-hint">▲▼ MOVE · ENTER SELECT</div>
  </section>

  <!-- ===========================================================
       PICKER — add a city
       =========================================================== -->
  <section id="picker" class="screen hidden">
    <header class="step-head">
      <span class="step-title">ADD&nbsp;CITY</span>
      <span class="step-hint mono">ENTER TOGGLE · ◀ BACK</span>
    </header>

    <div class="city-list" id="city-list"><!-- cities injected --></div>
  </section>

</div>
<script src="app.js"></script>
<script>
  // Offline support: network-first service worker (see sw.js). No-op where unsupported.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
